# ── Servidor ──────────────────────────────────────────────────────────────────
spring.application.name=pago-service
server.port=8088

# ── Actuator ──────────────────────────────────────────────────────────────────
management.server.port=8089
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Base de datos ─────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/pagodb}
spring.datasource.username=${DB_USER:pago}
spring.datasource.password=${DB_PASS:pago123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── OAuth2 Resource Server ────────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8090/realms/curso-springboot}

# ── Kafka ─────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ── MercadoPago ───────────────────────────────────────────────────────────────
mp.access-token=${MP_ACCESS_TOKEN:TEST-REEMPLAZA_CON_TU_TOKEN}
mp.webhook-secret=${MP_WEBHOOK_SECRET:REEMPLAZA_CON_TU_SECRETO}
mp.webhook-url=${MP_WEBHOOK_URL:https://TU-URL.ngrok-free.app}

